name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "api/.python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Pyright
        run: uv run pyright

      - name: Run tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-frontend
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_BACKEND_BASE_URL: http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site-frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: site-frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: site-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:runtime
      - run: pnpm run check
      - run: pnpm run test:contracts
      - run: pnpm run build
      - run: pnpm run test:ssr
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
